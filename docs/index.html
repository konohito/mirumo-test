<!doctype html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#06080c">
<title>みるも見守りダッシュボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="vendor/chart.umd.min.js"></script>
<script>try { const t = localStorage.getItem("mirumo-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<style>
/* ===================== tokens ===================== */
:root {
  color-scheme: light;
  --bg: #eef0f5;
  --bg-grid: rgba(20,30,60,.045);
  --glow-1: rgba(42,120,214,.16);
  --glow-2: rgba(98,80,214,.12);
  --glow-3: rgba(27,175,122,.10);
  --surface-1: #ffffff;
  --surface-2: #f4f5f8;
  --surface-3: #e9ebf0;
  --border: rgba(15,20,40,.08);
  --border-strong: rgba(15,20,40,.14);
  --text-primary: #0b0d12;
  --text-secondary: #4a4c55;
  --text-muted: #868893;
  --grid: rgba(15,20,40,.07);
  --series-1: #2a78d6; /* 離床 */
  --series-2: #eb6834; /* トイレ */
  --series-3: #1baf7a; /* ドア */
  --night-hue: #6250d6;
  --night: rgba(98,80,214,.08);
  --seq-0: #eef2f8; --seq-1: #cde2fb; --seq-2: #9ec5f4; --seq-3: #6da7ec; --seq-4: #3987e5; --seq-5: #256abf; --seq-6: #104281;
  --good: #0a8a3a; --warning: #c98500; --critical: #d03b3b;
  --accent-grad: linear-gradient(110deg,#2a78d6 0%,#6250d6 50%,#1baf7a 100%);
  --card-shadow: 0 1px 2px rgba(10,20,40,.04), 0 12px 32px -12px rgba(10,20,40,.12);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #06080c;
  --bg-grid: rgba(255,255,255,.028);
  --glow-1: rgba(57,135,229,.22);
  --glow-2: rgba(144,133,233,.16);
  --glow-3: rgba(25,158,112,.12);
  --surface-1: #10131a;
  --surface-2: #171b24;
  --surface-3: #1f2430;
  --border: rgba(255,255,255,.07);
  --border-strong: rgba(255,255,255,.13);
  --text-primary: #f3f2ef;
  --text-secondary: #c3c2b7;
  --text-muted: #8a8a92;
  --grid: rgba(255,255,255,.06);
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
  --night-hue: #9085e9;
  --night: rgba(144,133,233,.10);
  --seq-0: #161a23; --seq-1: #102c55; --seq-2: #184f95; --seq-3: #256abf; --seq-4: #3987e5; --seq-5: #6da7ec; --seq-6: #b7d3f6;
  --good: #3fbf6f; --warning: #e0a01a; --critical: #e66767;
  --card-shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 20px 40px -20px rgba(0,0,0,.6);
}

/* ===================== base ===================== */
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
html, body { margin: 0; }
body {
  background:
    radial-gradient(900px 520px at 0% -5%, var(--glow-1), transparent 60%),
    radial-gradient(800px 480px at 100% 0%, var(--glow-2), transparent 60%),
    radial-gradient(700px 500px at 50% 110%, var(--glow-3), transparent 60%),
    linear-gradient(var(--bg-grid) 1px, transparent 1px) 0 0 / 40px 40px,
    linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px) 0 0 / 40px 40px,
    var(--bg);
  background-attachment: fixed;
  color: var(--text-primary);
  font-family: "Inter", "Noto Sans JP", system-ui, sans-serif;
  font-size: 15px; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 28px 80px; }
button { font: inherit; }

/* ===================== top bar ===================== */
.topbar {
  position: sticky; top: 0; z-index: 30;
  backdrop-filter: saturate(170%) blur(16px); -webkit-backdrop-filter: saturate(170%) blur(16px);
  background: color-mix(in srgb, var(--bg) 70%, transparent);
  border-bottom: 1px solid var(--border);
}
.topbar-inner { max-width: 1280px; margin: 0 auto; padding: 12px 28px; display: flex; align-items: center; gap: 18px; }
.brand { display: flex; align-items: center; gap: 12px; flex: none; }
.logo {
  width: 38px; height: 38px; border-radius: 12px; background: var(--accent-grad); color: #fff;
  display: grid; place-items: center; box-shadow: 0 8px 24px -6px rgba(98,80,214,.6);
}
.brand b { display: block; font-size: 15px; font-weight: 900; letter-spacing: .04em; }
.brand small { display: block; color: var(--text-muted); font-size: 11px; font-weight: 600; letter-spacing: .06em; }
.nav { display: flex; gap: 2px; margin: 0 auto; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav a {
  color: var(--text-secondary); text-decoration: none; font-size: 13.5px; font-weight: 700;
  padding: 8px 14px; border-radius: 10px; white-space: nowrap; transition: color .15s, background .15s;
}
.nav a:hover { color: var(--text-primary); background: var(--surface-2); }
.nav a.on { color: var(--text-primary); background: var(--surface-2); box-shadow: inset 0 -2px 0 var(--series-1); }
.tools { display: flex; gap: 10px; align-items: center; flex: none; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 3px; }
.seg button {
  border: 0; background: transparent; color: var(--text-secondary); font-size: 13px; font-weight: 700;
  padding: 6px 13px; border-radius: 9px; cursor: pointer; transition: background .15s, color .15s; white-space: nowrap;
}
.seg button:hover { color: var(--text-primary); }
.seg button[aria-pressed="true"] { background: var(--surface-1); color: var(--text-primary); box-shadow: 0 2px 8px rgba(0,0,0,.18), 0 0 0 1px var(--border); }
.icon-btn {
  width: 36px; height: 36px; border-radius: 11px; border: 1px solid var(--border); background: var(--surface-2);
  color: var(--text-secondary); display: grid; place-items: center; cursor: pointer; font-size: 18px; line-height: 1;
}
.icon-btn:hover { color: var(--text-primary); border-color: var(--border-strong); }

/* ===================== sections ===================== */
section.block { scroll-margin-top: 84px; margin-top: 56px; }
.sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.sec-head .idx { font-size: 12px; font-weight: 800; letter-spacing: .2em; color: var(--text-muted); }
.sec-head h2 { margin: 2px 0 0; font-size: 26px; font-weight: 900; letter-spacing: -.01em; }
.sec-head p { margin: 2px 0 0; color: var(--text-secondary); font-size: 14px; }

.grid { display: grid; gap: 18px; }
.card {
  background: var(--surface-1); border: 1px solid var(--border); border-radius: 22px;
  box-shadow: var(--card-shadow); padding: 24px; min-width: 0; position: relative;
}
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.card h3 { margin: 0; font-size: 17px; font-weight: 800; }
.card .sub { margin: 3px 0 0; color: var(--text-muted); font-size: 13px; }

/* ===================== hero ===================== */
.hero { padding-top: 40px; }
.hero-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; letter-spacing: .18em; color: var(--text-muted); }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); animation: pulse 2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 60%, transparent); } 70% { box-shadow: 0 0 0 9px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.hero h1 { font-size: clamp(32px, 5vw, 52px); font-weight: 900; margin: 6px 0 0; letter-spacing: -.02em; line-height: 1.1; }
.hero h1 .grad { background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero .period { color: var(--text-secondary); font-size: 14px; text-align: right; }
.hero .period b { color: var(--text-primary); font-size: 16px; }

.hero-grid { grid-template-columns: 1.35fr 1fr; }
@media (max-width: 980px) { .hero-grid { grid-template-columns: 1fr; } }

/* gradient-bordered "today" card */
.today {
  border: 1px solid transparent;
  background:
    linear-gradient(var(--surface-1), var(--surface-1)) padding-box,
    linear-gradient(135deg, color-mix(in srgb, #3987e5 70%, transparent), color-mix(in srgb, #9085e9 50%, transparent) 45%, color-mix(in srgb, #199e70 55%, transparent)) border-box;
  overflow: hidden;
}
.today::after {
  content: ""; position: absolute; inset: -40% -20% auto auto; width: 420px; height: 420px; border-radius: 50%;
  background: radial-gradient(closest-side, var(--glow-1), transparent); pointer-events: none;
}
.today-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; position: relative; z-index: 1; }
.today-head .lbl { font-size: 12px; font-weight: 800; letter-spacing: .16em; color: var(--text-muted); }
.today-head .date { font-size: 30px; font-weight: 900; letter-spacing: -.01em; margin-top: 2px; }
.status {
  display: inline-flex; align-items: center; gap: 8px; font-weight: 800; font-size: 14px; padding: 8px 14px 8px 10px; border-radius: 999px;
  border: 1px solid var(--border-strong); background: var(--surface-2);
}
.status .dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 12px; }
.status.good .dot { background: var(--good); box-shadow: 0 0 16px color-mix(in srgb, var(--good) 60%, transparent); }
.status.warning .dot { background: var(--warning); box-shadow: 0 0 16px color-mix(in srgb, var(--warning) 60%, transparent); }
.cmp { margin-top: 20px; display: flex; flex-direction: column; gap: 16px; position: relative; z-index: 1; }
.cmp-row { display: grid; grid-template-columns: 112px 1fr 128px; align-items: center; gap: 16px; }
.cmp-row .name { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 8px; color: var(--text-secondary); }
.cmp-row .name i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.cmp-row .val { text-align: right; }
.cmp-row .val b { font-size: 26px; font-weight: 900; letter-spacing: -.02em; }
.cmp-row .val small { color: var(--text-muted); font-size: 12px; margin-left: 3px; }
.cmp-row .val .d { display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); line-height: 1.2; }
.cmp-row .val .d.flag { color: var(--warning); }
.bullet { position: relative; height: 12px; border-radius: 999px; background: var(--surface-3); overflow: visible; }
.bullet .fill { position: absolute; inset: 0 auto 0 0; border-radius: 999px; transition: width .9s cubic-bezier(.2,.8,.2,1); width: 0; }
.bullet .avg { position: absolute; top: -5px; bottom: -5px; width: 3px; border-radius: 2px; background: var(--text-primary); opacity: .8; }
.bullet .avg::after { content: "平均"; position: absolute; top: -17px; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 700; color: var(--text-muted); white-space: nowrap; }
.cmp-row:not(:first-child) .bullet .avg::after { display: none; }
.today-foot { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; position: relative; z-index: 1; }
.today-foot span { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 6px 12px; font-size: 13px; color: var(--text-secondary); }
.today-foot b { color: var(--text-primary); }

/* alerts */
.alerts { display: flex; flex-direction: column; gap: 10px; }
.alert { display: flex; gap: 14px; align-items: center; padding: 14px 16px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--border); }
.alert .ico { flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: #fff; font-weight: 900; font-size: 15px; }
.alert.critical .ico { background: var(--critical); }
.alert.warning .ico { background: var(--warning); }
.alert.info .ico { background: var(--series-1); }
.alert.good .ico { background: var(--good); }
.alert b { display: block; font-size: 14.5px; line-height: 1.35; }
.alert span { color: var(--text-secondary); font-size: 13px; }

/* KPI */
.kpis { grid-template-columns: repeat(6, minmax(0, 1fr)); margin-top: 18px; }
@media (max-width: 1180px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 640px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { padding: 18px 18px 12px; overflow: hidden; transition: transform .2s, border-color .2s; }
.kpi:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--kc) 50%, transparent); }
.kpi::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--kc); }
.kpi .label { font-size: 12.5px; color: var(--text-secondary); font-weight: 700; display: flex; align-items: center; gap: 7px; }
.kpi .label i { width: 8px; height: 8px; border-radius: 3px; background: var(--kc); }
.kpi .value { font-size: 34px; font-weight: 900; letter-spacing: -.03em; margin-top: 4px; line-height: 1.1; }
.kpi .value small { font-size: 13px; font-weight: 700; color: var(--text-muted); margin-left: 3px; letter-spacing: 0; }
.kpi .meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.kpi svg { display: block; width: 100%; height: 36px; margin-top: 8px; overflow: visible; }

/* ===================== rhythm ===================== */
.rhythm-grid { grid-template-columns: 420px 1fr; }
@media (max-width: 1080px) { .rhythm-grid { grid-template-columns: 1fr; } }
.clock-wrap { display: grid; place-items: center; }
.clock { width: 100%; max-width: 380px; height: auto; display: block; }
.clock text { font-family: Inter, sans-serif; }
.clock .wedge { transition: opacity .15s; cursor: pointer; }
.clock:hover .wedge { opacity: .45; }
.clock .hour:hover .wedge { opacity: 1; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--text-secondary); font-weight: 600; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.legend i.line { height: 3px; width: 16px; border-radius: 2px; }
.legend i.ring { background: transparent !important; border: 2px solid; border-radius: 50%; }

.heat { display: grid; grid-template-columns: 82px repeat(24, minmax(0, 1fr)); gap: 4px; font-size: 11.5px; }
.heat .hl { color: var(--text-muted); text-align: left; font-weight: 600; }
.heat .dl { color: var(--text-secondary); white-space: nowrap; display: flex; align-items: center; font-weight: 700; cursor: pointer; font-size: 12.5px; }
.heat .dl:hover, .heat .dl.sel { color: var(--text-primary); }
.heat .dl.sel::before { content: ""; width: 4px; height: 16px; border-radius: 2px; background: var(--accent-grad); margin-right: 6px; }
.heat .c { height: 26px; border-radius: 6px; background: var(--seq-0); cursor: pointer; transition: transform .12s; }
.heat .c:hover { transform: scale(1.18); box-shadow: 0 0 0 2px var(--text-primary); position: relative; z-index: 2; }
.heat .c.night { box-shadow: inset 0 -3px 0 color-mix(in srgb, var(--night-hue) 75%, transparent); }
.heat-scroll { overflow-x: auto; padding-bottom: 4px; }
.heat-scroll .heat { min-width: 680px; }
.heat-legend { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); margin-top: 14px; flex-wrap: wrap; }
.heat-legend .ramp { display: flex; gap: 3px; }
.heat-legend .ramp i { width: 20px; height: 10px; border-radius: 3px; display: block; }

/* ===================== day ===================== */
.day-picker { display: flex; align-items: center; gap: 8px; }
.day-picker select {
  font: inherit; font-weight: 800; font-size: 15px; color: var(--text-primary); background: var(--surface-2);
  border: 1px solid var(--border); border-radius: 11px; padding: 7px 12px; cursor: pointer;
}
.timeline { width: 100%; height: auto; display: block; }
.timeline text { fill: var(--text-muted); font-size: 12px; font-family: Inter, sans-serif; font-weight: 600; }
.timeline .lane-label { fill: var(--text-secondary); font-weight: 800; font-size: 13px; font-family: "Noto Sans JP", sans-serif; }
.timeline .ev { cursor: pointer; }
.day-stats { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; margin-top: 18px; }
@media (max-width: 900px) { .day-stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 520px) { .day-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.day-stats div { background: var(--surface-2); border-radius: 14px; padding: 12px 14px; border: 1px solid var(--border); }
.day-stats small { color: var(--text-muted); font-size: 12px; display: block; font-weight: 600; }
.day-stats b { font-size: 21px; font-weight: 900; letter-spacing: -.01em; }
.day-stats b small { display: inline; font-size: 12px; color: var(--text-muted); margin-left: 2px; }
.day-multiples { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 18px; }
@media (max-width: 860px) { .day-multiples { grid-template-columns: 1fr; } }
.mini { background: var(--surface-2); border: 1px solid var(--border); border-radius: 16px; padding: 14px 14px 8px; }
.mini h4 { margin: 0 0 6px; font-size: 13px; color: var(--text-secondary); font-weight: 800; display: flex; justify-content: space-between; }
.mini h4 span { color: var(--text-muted); font-weight: 600; }

/* ===================== trends ===================== */
.two { grid-template-columns: 1fr 1fr; }
@media (max-width: 900px) { .two { grid-template-columns: 1fr; } }
.chart-box { position: relative; height: 300px; }
.chart-box.md { height: 250px; }
.chart-box.sm { height: 150px; }

/* ===================== log ===================== */
.chip {
  border: 1px solid var(--border); background: var(--surface-2); color: var(--text-secondary); font-size: 13px; font-weight: 700;
  padding: 6px 13px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
}
.chip[aria-pressed="false"] { opacity: .5; }
.chip[aria-pressed="true"] { color: var(--text-primary); border-color: var(--border-strong); }
.chip i { width: 9px; height: 9px; border-radius: 50%; }
.table-tools { display: flex; gap: 8px; flex-wrap: wrap; }
.table-wrap { max-height: 460px; overflow: auto; border-radius: 14px; border: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 11px 16px; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { position: sticky; top: 0; background: var(--surface-2); color: var(--text-muted); font-size: 12px; font-weight: 800; letter-spacing: .08em; z-index: 1; }
tbody tr:hover { background: var(--surface-2); }
tr.daysep td { background: var(--surface-3); color: var(--text-secondary); font-weight: 800; font-size: 12.5px; padding: 6px 16px; position: sticky; top: 40px; }
.pill { display: inline-flex; align-items: center; gap: 7px; font-weight: 700; }
.pill i { width: 9px; height: 9px; border-radius: 50%; }
.badge { font-size: 11.5px; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: color-mix(in srgb, var(--warning) 18%, transparent); color: var(--text-primary); border: 1px solid color-mix(in srgb, var(--warning) 55%, transparent); }

/* tooltip */
.tip {
  position: fixed; pointer-events: none; z-index: 60; background: var(--surface-1); color: var(--text-primary);
  border: 1px solid var(--border-strong); border-radius: 12px; padding: 10px 12px; font-size: 13px; box-shadow: 0 16px 40px rgba(0,0,0,.35);
  opacity: 0; transform: translateY(4px); transition: opacity .1s, transform .1s; min-width: 150px;
}
.tip.show { opacity: 1; transform: none; }
.tip > b { display: block; margin-bottom: 4px; }
.tip .r { display: flex; justify-content: space-between; align-items: center; gap: 18px; color: var(--text-secondary); }
.tip .r span { display: inline-flex; align-items: center; gap: 6px; }
.tip .r i { width: 8px; height: 8px; border-radius: 2px; }
.tip .r b { color: var(--text-primary); }

footer { color: var(--text-muted); font-size: 12.5px; margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
.loading { padding: 120px 0; text-align: center; color: var(--text-muted); }

.reveal { opacity: 0; transform: translateY(14px); transition: opacity .6s ease, transform .6s cubic-bezier(.2,.8,.2,1); }
.reveal.in { opacity: 1; transform: none; }

@media (max-width: 860px) {
  .nav { display: none; }
  .topbar-inner { justify-content: space-between; }
}
@media (max-width: 640px) {
  body { font-size: 14px; }
  .wrap, .topbar-inner { padding-left: 16px; padding-right: 16px; }
  .brand small { display: none; }
  .card { padding: 18px; border-radius: 18px; }
  .hero .period { text-align: left; }
  .cmp-row { grid-template-columns: 84px 1fr 96px; gap: 10px; }
  .cmp-row .val b { font-size: 22px; }
  .today-head .date { font-size: 24px; }
  .sec-head h2 { font-size: 22px; }
  .kpi .value { font-size: 28px; }
  .chart-box { height: 250px; }
  .seg button { padding: 6px 10px; }
}
@media (prefers-reduced-motion: reduce) { *, .reveal { animation: none !important; transition: none !important; opacity: 1 !important; transform: none !important; } }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </div>
      <div><b>MIRUMO</b><small>見守りダッシュボード</small></div>
    </div>
    <nav class="nav" id="nav">
      <a href="#overview">概要</a><a href="#rhythm">生活リズム</a><a href="#day">1日の詳細</a><a href="#trends">推移</a><a href="#log">ログ</a>
    </nav>
    <div class="tools">
      <div class="seg" role="group" aria-label="集計期間" id="rangeSeg">
        <button data-range="3">3日</button><button data-range="7">7日</button><button data-range="all" aria-pressed="true">全期間</button>
      </div>
      <button class="icon-btn" id="themeBtn" title="ライト / ダーク切替" aria-label="テーマ切替">◐</button>
    </div>
  </div>
</header>

<main class="wrap" id="app"><div class="loading">データを読み込み中…</div></main>
<div class="tip" id="tip"></div>

<script>
(() => {
  const root = document.documentElement;
  const $ = (s, el = document) => el.querySelector(s);
  const css = (n) => getComputedStyle(root).getPropertyValue(n).trim();
  const fmt = (v, d = 1) => (v == null || !isFinite(v) ? "–" : Number(v).toFixed(d));
  const WD = ["日", "月", "火", "水", "木", "金", "土"];
  const D = (iso) => new Date(iso + "T00:00:00");
  const md = (iso) => { const d = D(iso); return `${d.getMonth() + 1}/${d.getDate()}`; };
  const mdw = (iso) => { const d = D(iso); return `${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]})`; };
  const mean = (xs) => { const v = xs.filter((x) => x != null && isFinite(x)); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  const sd = (xs) => { const m = mean(xs); const v = xs.filter((x) => x != null); return v.length > 1 ? Math.sqrt(v.reduce((a, b) => a + (b - m) ** 2, 0) / (v.length - 1)) : 0; };
  const alpha = (hex, a) => hex + Math.round(a * 255).toString(16).padStart(2, "0");

  const G = {
    "離床":   { label: "離床",   tok: "--series-1", type: "離床" },
    "トイレ": { label: "トイレ", tok: "--series-2", type: "トイレON" },
    "ドア":   { label: "ドア開", tok: "--series-3", type: "ドアオープン" },
  };
  const GROUPS = Object.keys(G);
  const evGroup = (t) => t === "離床" ? "離床" : t.startsWith("トイレ") ? "トイレ" : "ドア";
  const cnt = (d, g) => d.counts[G[g].type];
  const isFull = (d) => d.sensorMinutes >= 1380;

  let DATA, RANGE = "all", SEL_DAY, HEAT_G = "all", charts = [], dayCharts = [];
  const LOG_FILTER = new Set(GROUPS);

  // ---------- theme ----------
  $("#themeBtn").addEventListener("click", () => {
    root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
    try { localStorage.setItem("mirumo-theme", root.dataset.theme); } catch (e) {}
    if (DATA) renderAll(false);
  });

  // ---------- tooltip ----------
  const tip = $("#tip");
  function showTip(html, x, y) {
    tip.innerHTML = html; tip.classList.add("show");
    const r = tip.getBoundingClientRect();
    let l = x + 16, t = y + 16;
    if (l + r.width > innerWidth - 8) l = x - r.width - 16;
    if (t + r.height > innerHeight - 8) t = y - r.height - 16;
    tip.style.left = Math.max(8, l) + "px"; tip.style.top = Math.max(8, t) + "px";
  }
  const hideTip = () => tip.classList.remove("show");
  const tipRow = (color, label, val) => `<div class="r"><span><i style="background:${color}"></i>${label}</span><b class="num">${val}</b></div>`;

  // ---------- load ----------
  fetch("data/dashboard.json", { cache: "no-store" })
    .then((r) => r.json())
    .then((d) => { DATA = d; SEL_DAY = latestFull().date; renderAll(true); })
    .catch((e) => { $("#app").innerHTML = `<div class="loading">データの読み込みに失敗しました: ${e}</div>`; });

  $("#rangeSeg").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    RANGE = b.dataset.range;
    document.querySelectorAll("#rangeSeg button").forEach((x) => x.setAttribute("aria-pressed", x === b));
    if (!rangeDays().some((d) => d.date === SEL_DAY)) SEL_DAY = latestFull(rangeDays()).date;
    renderAll(false);
  });

  const latestFull = (days = DATA.days) => { const f = days.filter(isFull); return f.length ? f[f.length - 1] : days[days.length - 1]; };
  const rangeDays = () => RANGE === "all" ? DATA.days : DATA.days.slice(-Number(RANGE));

  // ---------- chart helpers ----------
  function chartDefaults() {
    Chart.defaults.font.family = "Inter, 'Noto Sans JP', sans-serif";
    Chart.defaults.font.size = 12;
    Chart.defaults.font.weight = 600;
    Chart.defaults.color = css("--text-muted");
    Chart.defaults.borderColor = css("--grid");
    Chart.defaults.plugins.legend.display = false;
    Chart.defaults.animation.duration = 700;
    Chart.defaults.animation.easing = "easeOutQuart";
    Object.assign(Chart.defaults.plugins.tooltip, {
      backgroundColor: css("--surface-1"), titleColor: css("--text-primary"), bodyColor: css("--text-secondary"),
      borderColor: css("--border-strong"), borderWidth: 1, padding: 12, cornerRadius: 12, boxPadding: 5, usePointStyle: true,
      titleFont: { weight: 800, size: 13 }, bodyFont: { weight: 600, size: 12.5 },
    });
  }
  const ax = (extra = {}) => ({ grid: { color: css("--grid"), drawTicks: false }, border: { display: false }, ticks: { color: css("--text-muted"), padding: 8 }, ...extra });
  const vgrad = (color, a1 = 1, a2 = .55) => (ctx) => {
    const { chart } = ctx; const area = chart.chartArea; if (!area) return color;
    const g = chart.ctx.createLinearGradient(0, area.top, 0, area.bottom);
    g.addColorStop(0, alpha(color, a1)); g.addColorStop(1, alpha(color, a2)); return g;
  };
  const areaGrad = (color) => (ctx) => {
    const { chart } = ctx; const area = chart.chartArea; if (!area) return alpha(color, .15);
    const g = chart.ctx.createLinearGradient(0, area.top, 0, area.bottom);
    g.addColorStop(0, alpha(color, .35)); g.addColorStop(1, alpha(color, 0)); return g;
  };
  const bar = { borderRadius: 6, borderSkipped: "bottom" };

  // ---------- render ----------
  function renderAll(first) {
    charts.forEach((c) => c.destroy()); charts = [];
    dayCharts.forEach((c) => c.destroy()); dayCharts = [];
    chartDefaults();
    const days = rangeDays();
    const ref = latestFull(days);
    const evCount = DATA.events.filter((e) => e.t.slice(0, 10) >= days[0].date).length;

    $("#app").innerHTML = `
      <section class="block hero" id="overview" style="margin-top:0">
        <div class="hero-top">
          <div>
            <span class="eyebrow"><span class="live-dot"></span>DEVICE #${DATA.deviceId} · MONITORING</span>
            <h1>見守り<span class="grad">インサイト</span></h1>
          </div>
          <div class="period"><b>${mdw(days[0].date)} – ${mdw(days[days.length - 1].date)}</b><br>${days.length} 日間 · 通知 ${evCount.toLocaleString()} 件</div>
        </div>
        <div class="grid hero-grid">
          <div class="card today" id="today"></div>
          <div class="card">
            <div class="card-head"><div><h3>注目ポイント</h3><p class="sub">期間内の気になる変化を自動でピックアップ</p></div></div>
            <div class="alerts" id="alerts"></div>
          </div>
        </div>
        <div class="grid kpis" id="kpis"></div>
      </section>

      <section class="block reveal" id="rhythm">
        <div class="sec-head">
          <div><div class="idx">01 — RHYTHM</div><h2>生活リズム</h2><p>何時ごろに動いているか。夜間帯（${DATA.nightWindow[0]}時〜${DATA.nightWindow[1]}時）は紫で表示</p></div>
          <div class="legend">${GROUPS.map((g) => `<span><i style="background:${css(G[g].tok)}"></i>${G[g].label}</span>`).join("")}<span><i style="background:${css("--night")};border:1px solid ${css("--night-hue")}"></i>夜間帯</span></div>
        </div>
        <div class="grid rhythm-grid">
          <div class="card">
            <div class="card-head"><div><h3>24時間アクティビティ時計</h3><p class="sub">離床＋トイレ＋ドア開の1日平均回数。外に伸びるほど活発</p></div></div>
            <div class="clock-wrap" id="clock"></div>
          </div>
          <div class="card">
            <div class="card-head">
              <div><h3>日別 × 時間帯ヒートマップ</h3><p class="sub">色が濃いほど反応が多い。日付をクリックで「1日の詳細」へ</p></div>
              <div class="seg" id="heatSeg">
                <button data-g="all" aria-pressed="${HEAT_G === "all"}">すべて</button>${GROUPS.map((g) => `<button data-g="${g}" aria-pressed="${HEAT_G === g}">${g}</button>`).join("")}
              </div>
            </div>
            <div class="heat-scroll"><div class="heat" id="heat"></div></div>
            <div class="heat-legend"><span>少</span><span class="ramp" id="heatRamp"></span><span>多</span></div>
          </div>
        </div>
      </section>

      <section class="block reveal" id="day">
        <div class="sec-head">
          <div><div class="idx">02 — DAY VIEW</div><h2>1日の詳細</h2><p>イベントの発生時刻と、室内環境の推移</p></div>
          <div class="day-picker">
            <button class="icon-btn" id="dayPrev" aria-label="前日">‹</button>
            <select id="daySel" aria-label="日付">${DATA.days.map((d) => `<option value="${d.date}">${mdw(d.date)}</option>`).join("")}</select>
            <button class="icon-btn" id="dayNext" aria-label="翌日">›</button>
          </div>
        </div>
        <div class="card">
          <div id="timeline"></div>
          <div class="day-stats" id="dayStats"></div>
          <div class="day-multiples">
            <div class="mini"><h4>室温 <span>℃</span></h4><div class="chart-box sm"><canvas id="dTemp"></canvas></div></div>
            <div class="mini"><h4>照度 <span>lx</span></h4><div class="chart-box sm"><canvas id="dLux"></canvas></div></div>
            <div class="mini"><h4>運動指数 <span>10分平均</span></h4><div class="chart-box sm"><canvas id="dMotion"></canvas></div></div>
          </div>
        </div>
      </section>

      <section class="block reveal" id="trends">
        <div class="sec-head"><div><div class="idx">03 — TRENDS</div><h2>推移</h2><p>日ごとの変化。バーをクリックするとその日の詳細へ移動</p></div></div>
        <div class="grid">
          <div class="card">
            <div class="card-head"><div><h3>日別アクティビティ</h3><p class="sub">離床・トイレ使用・ドア開の回数</p></div>
              <div class="legend">${GROUPS.map((g) => `<span><i style="background:${css(G[g].tok)}"></i>${G[g].label}</span>`).join("")}</div></div>
            <div class="chart-box"><canvas id="dailyChart"></canvas></div>
          </div>
          <div class="grid two">
            <div class="card">
              <div class="card-head"><div><h3>夜間の離床</h3><p class="sub">${DATA.nightWindow[0]}:00〜翌${DATA.nightWindow[1]}:00 の回数（夜の開始日で集計）</p></div></div>
              <div class="chart-box md"><canvas id="nightChart"></canvas></div>
            </div>
            <div class="card">
              <div class="card-head"><div><h3>トイレ滞在時間</h3><p class="sub">1回ごとの滞在（分）。赤い点は30分以上</p></div></div>
              <div class="chart-box md"><canvas id="toiletChart"></canvas></div>
            </div>
            <div class="card">
              <div class="card-head"><div><h3>室温</h3><p class="sub">日別の最低〜最高（帯）と平均（線）</p></div></div>
              <div class="chart-box md"><canvas id="tempChart"></canvas></div>
            </div>
            <div class="card">
              <div class="card-head"><div><h3>湿度</h3><p class="sub">10分平均</p></div></div>
              <div class="chart-box md"><canvas id="humChart"></canvas></div>
            </div>
          </div>
          <div class="card">
            <div class="card-head"><div><h3>睡眠・起床</h3><p class="sub">みるもの睡眠データ「夜間起床」の値（機器の出力値）</p></div></div>
            <div class="chart-box md"><canvas id="sleepChart"></canvas></div>
          </div>
        </div>
      </section>

      <section class="block reveal" id="log">
        <div class="sec-head">
          <div><div class="idx">04 — LOG</div><h2>通知ログ</h2><p id="logCount"></p></div>
          <div class="table-tools" id="logTools">${GROUPS.map((g) => `<button class="chip" data-g="${g}" aria-pressed="${LOG_FILTER.has(g)}"><i style="background:${css(G[g].tok)}"></i>${g}</button>`).join("")}</div>
        </div>
        <div class="card" style="padding:0;overflow:hidden">
          <div class="table-wrap" style="border:0;border-radius:0"><table><thead><tr><th>時刻</th><th>種別</th><th>内容</th><th></th></tr></thead><tbody id="logBody"></tbody></table></div>
        </div>
      </section>

      <footer><span>データ更新 ${DATA.generatedAt.replace("T", " ").slice(0, 16)}</span><span>収録期間 ${DATA.period.from} 〜 ${DATA.period.to}</span></footer>
    `;

    renderToday(days, ref);
    renderAlerts(days);
    renderKpis(days);
    renderClock(days);
    renderHeat(days);
    renderDay();
    renderDaily(days);
    renderNight(days);
    renderToilet(days);
    renderTemp(days);
    renderHum(days);
    renderSleep(days);
    renderLog(days);
    bind(days);
    setupReveal(first);
    setupNav();
  }

  // ---------- count-up ----------
  function countUp(el) {
    const to = parseFloat(el.dataset.to), dec = +el.dataset.dec || 0;
    if (!isFinite(to) || matchMedia("(prefers-reduced-motion: reduce)").matches) { el.textContent = fmt(to, dec); return; }
    const t0 = performance.now(), dur = 900;
    const step = (t) => { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = (to * e).toFixed(dec); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }
  const cu = (v, dec = 0) => `<span class="cu" data-to="${v ?? ""}" data-dec="${dec}">${v == null ? "–" : (0).toFixed(dec)}</span>`;

  // ---------- today (latest day vs average) ----------
  function renderToday(days, ref) {
    const full = days.filter(isFull);
    const base = full.length >= 2 ? full : days;
    const metrics = [
      { name: "離床", color: css("--series-1"), get: (d) => d.counts["離床"], unit: "回" },
      { name: "夜間の離床", color: css("--night-hue"), get: (d) => d.nightBedExit, unit: "回" },
      { name: "トイレ", color: css("--series-2"), get: (d) => d.counts["トイレON"], unit: "回" },
      { name: "ドア開", color: css("--series-3"), get: (d) => d.counts["ドアオープン"], unit: "回" },
    ];
    let flags = 0;
    const rows = metrics.map((m) => {
      const vals = base.map(m.get), v = m.get(ref), a = mean(vals), s = sd(vals);
      const max = Math.max(...days.map(m.get), 1);
      const diff = a ? ((v - a) / a) * 100 : 0;
      const flag = (s > 0 && Math.abs(v - a) >= 1.5 * s) || (Math.abs(diff) >= 40 && Math.abs(v - a) >= 3);
      if (flag) flags++;
      const dTxt = Math.abs(diff) < 5 ? "平均並み" : `平均比 ${diff > 0 ? "+" : ""}${fmt(diff, 0)}%`;
      return `<div class="cmp-row">
        <div class="name"><i style="background:${m.color}"></i>${m.name}</div>
        <div class="bullet" title="平均 ${fmt(a)}${m.unit}"><div class="fill" data-w="${(v / max) * 100}" style="background:linear-gradient(90deg, ${alpha(m.color, .55)}, ${m.color})"></div><div class="avg" style="left:calc(${(a / max) * 100}% - 1.5px)"></div></div>
        <div class="val"><b class="num">${cu(v)}</b><small>${m.unit}</small><span class="d ${flag ? "flag" : ""}">${flag ? "⚠ " : ""}${dTxt}</span></div>
      </div>`;
    }).join("");
    const status = flags ? `<span class="status warning"><span class="dot">!</span>いつもと違う点 ${flags} 件</span>` : `<span class="status good"><span class="dot">✓</span>いつも通り</span>`;
    const sl = DATA.sleep.find((s) => s.date === ref.date);
    $("#today").innerHTML = `
      <div class="today-head">
        <div><div class="lbl">LATEST DAY · 最新の1日</div><div class="date">${mdw(ref.date)}</div></div>
        ${status}
      </div>
      <div class="cmp">${rows}</div>
      <div class="today-foot">
        <span>トイレ平均滞在 <b class="num">${fmt(ref.toiletAvgMin)}</b> 分</span>
        <span>室温 <b class="num">${fmt(ref.tempMin)}〜${fmt(ref.tempMax)}</b> ℃</span>
        <span>湿度 <b class="num">${fmt(ref.humAvg, 0)}</b> %</span>
        ${sl?.wake ? `<span>起床 <b class="num">${sl.wake}</b></span>` : ""}
      </div>`;
    requestAnimationFrame(() => setTimeout(() => document.querySelectorAll("#today .fill").forEach((f) => f.style.width = Math.min(100, f.dataset.w) + "%"), 60));
  }

  // ---------- alerts ----------
  function renderAlerts(days) {
    const out = [];
    const inRange = (iso) => days.some((d) => d.date === iso.slice(0, 10));
    const long = DATA.toiletVisits.filter((v) => v.min >= 30 && inRange(v.start));
    if (long.length) {
      const top = [...long].sort((a, b) => b.min - a.min)[0];
      out.push({ lv: "warning", ico: "!", t: `トイレに30分以上：${long.length} 回`, b: `最長 ${fmt(top.min)} 分（${mdw(top.start.slice(0, 10))} ${top.start.slice(11, 16)}〜）` });
    }
    const nAvg = mean(days.map((d) => d.nightBedExit));
    const peak = days.reduce((a, d) => (d.nightBedExit > a.nightBedExit ? d : a), days[0]);
    if (peak.nightBedExit >= Math.max(3, nAvg * 1.5)) out.push({ lv: "warning", ico: "☾", t: `夜間の離床が多い夜：${mdw(peak.date)}`, b: `${peak.nightBedExit} 回（平均 ${fmt(nAvg)} 回/夜）` });
    const full = days.filter(isFull);
    if (full.length >= 4) {
      const h = Math.floor(full.length / 2);
      for (const [g, key, th] of [["トイレ", "トイレON", 15], ["ドア開閉", "ドアオープン", 20], ["離床", "離床", 20]]) {
        const a = mean(full.slice(0, h).map((d) => d.counts[key])), b = mean(full.slice(h).map((d) => d.counts[key]));
        const diff = a ? ((b - a) / a) * 100 : 0;
        if (Math.abs(diff) >= th) out.push({ lv: "info", ico: diff > 0 ? "↗" : "↘", t: `${g}が${diff > 0 ? "増加" : "減少"}傾向`, b: `前半 ${fmt(a)} → 後半 ${fmt(b)} 回/日（${diff > 0 ? "+" : ""}${fmt(diff, 0)}%）` });
      }
    }
    const hot = days.filter((d) => d.wbgtMax != null && d.wbgtMax >= 25);
    if (hot.length) out.push({ lv: "critical", ico: "▲", t: `暑さ指数25以上の日：${hot.length} 日`, b: `最大 ${Math.max(...hot.map((d) => d.wbgtMax))}。熱中症に注意` });
    const cold = days.filter((d) => d.tempMin != null && d.tempMin < 16);
    if (cold.length) out.push({ lv: "warning", ico: "▼", t: `室温16℃未満の日：${cold.length} 日`, b: `最低 ${fmt(Math.min(...cold.map((d) => d.tempMin)))} ℃` });
    const away = DATA.sensor.filter((s) => s.away > 0 && inRange(s.t)).length;
    out.push(away ? { lv: "warning", ico: "⇢", t: "外出（不在）判定あり", b: `約 ${away * 10} 分の不在を検知` } : { lv: "good", ico: "✓", t: "外出（不在）判定なし", b: "期間中はずっと在宅判定です" });
    $("#alerts").innerHTML = out.slice(0, 5).map((o) => `<div class="alert ${o.lv}"><div class="ico" aria-hidden="true">${o.ico}</div><div><b>${o.t}</b><span>${o.b}</span></div></div>`).join("");
  }

  // ---------- KPI ----------
  function spark(values, color) {
    const v = values.map((x) => x ?? 0), w = 200, h = 36, max = Math.max(...v), min = Math.min(...v);
    const pts = v.map((y, i) => [v.length === 1 ? w / 2 : (i / (v.length - 1)) * w, h - 4 - ((y - min) / (max - min || 1)) * (h - 8)]);
    const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
    const id = "s" + Math.random().toString(36).slice(2, 8), last = pts[pts.length - 1];
    return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
      <path d="${d} L${w} ${h} L0 ${h} Z" fill="url(#${id})"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
      <circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="${color}" stroke="${css("--surface-1")}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
  }
  function renderKpis(days) {
    const full = days.filter(isFull), base = full.length ? full : days;
    const tv = DATA.toiletVisits.filter((v) => days.some((d) => d.date === v.start.slice(0, 10)));
    const sum = (k) => days.reduce((a, d) => a + d.counts[k], 0);
    const items = [

  // ---------- 24h clock ----------
  function renderClock(days) {
    const n = days.length, size = 400, c = size / 2, r0 = 70, r1 = 168;
    const avg = [...Array(24)].map((_, h) => GROUPS.map((g) => days.reduce((a, d) => a + d.hourly[G[g].type][h], 0) / n));
    const tot = avg.map((a) => a.reduce((x, y) => x + y, 0));
    const max = Math.max(...tot, .1);
    const pt = (r, ang) => [c + r * Math.cos(ang), c + r * Math.sin(ang)];
    const sector = (ra, rb, a0, a1) => {
      const [x0, y0] = pt(ra, a0), [x1, y1] = pt(rb, a0), [x2, y2] = pt(rb, a1), [x3, y3] = pt(ra, a1);
      return `M${x0} ${y0} L${x1} ${y1} A${rb} ${rb} 0 0 1 ${x2} ${y2} L${x3} ${y3} A${ra} ${ra} 0 0 0 ${x0} ${y0} Z`;
    };
    const ang = (h) => (h / 24) * Math.PI * 2 - Math.PI / 2;
    const [ns, ne] = DATA.nightWindow;
    let s = `<svg class="clock" viewBox="0 0 ${size} ${size}" role="img" aria-label="24時間アクティビティ時計">`;
    s += `<defs><radialGradient id="clockGrad" cx="${c}" cy="${c}" r="${r1}" gradientUnits="userSpaceOnUse"><stop offset="${r0 / r1}" stop-color="${css("--seq-3")}"/><stop offset="1" stop-color="${css("--seq-6")}"/></radialGradient></defs>`;
    s += `<path d="${sector(r0 - 6, r1 + 6, ang(ns), ang(24 + ne))}" fill="${css("--night")}"/>`;
    [.25, .5, .75, 1].forEach((f) => s += `<circle cx="${c}" cy="${c}" r="${r0 + (r1 - r0) * f}" fill="none" stroke="${css("--grid")}" ${f === 1 ? "" : 'stroke-dasharray="2 4"'}/>`);
    s += `<circle cx="${c}" cy="${c}" r="${r0}" fill="none" stroke="${css("--grid")}"/>`;
    const gap = 0.012;
    for (let h = 0; h < 24; h++) {
      let r = r0 + 2;
      s += `<g class="hour" data-h="${h}">`;
      s += `<path d="${sector(r0, r1, ang(h) + gap, ang(h + 1) - gap)}" fill="transparent"/>`;
      const len = (tot[h] / max) * (r1 - r0 - 4);
      if (len > 0.3) s += `<path class="wedge" d="${sector(r, r + len, ang(h) + gap * 2, ang(h + 1) - gap * 2)}" fill="url(#clockGrad)"/>`;
      s += `</g>`;
    }
    for (let h = 0; h < 24; h += 3) {
      const [x, y] = pt(r1 + 20, ang(h));
      s += `<text x="${x}" y="${y + 4}" text-anchor="middle" font-size="12" font-weight="700" fill="${css("--text-muted")}">${h}時</text>`;
    }
    const peakH = tot.indexOf(Math.max(...tot));
    const quietDay = tot.slice(6, 22).indexOf(Math.min(...tot.slice(6, 22))) + 6;
    s += `<text x="${c}" y="${c - 18}" text-anchor="middle" font-size="11" font-weight="800" letter-spacing="2" fill="${css("--text-muted")}">PEAK</text>`;
    s += `<text x="${c}" y="${c + 12}" text-anchor="middle" font-size="30" font-weight="900" fill="${css("--text-primary")}">${peakH}時台</text>`;
    s += `<text x="${c}" y="${c + 32}" text-anchor="middle" font-size="11.5" font-weight="700" fill="${css("--text-muted")}">平均 ${fmt(tot[peakH])} 回</text>`;
    s += `</svg>`;
    const el = $("#clock");
    el.innerHTML = s + `<p class="sub" style="margin:8px 0 0;text-align:center">日中で最も静かな時間帯：<b style="color:${css("--text-primary")}">${quietDay}時台</b></p>`;
    el.onmousemove = (e) => {
      const g = e.target.closest(".hour"); if (!g) return hideTip();
      const h = +g.dataset.h;
      showTip(`<b>${h}:00〜${h + 1}:00（1日平均）</b>` + GROUPS.map((k, i) => tipRow(css(G[k].tok), G[k].label, fmt(avg[h][i]) + " 回")).join(""), e.clientX, e.clientY);
    };
    el.onmouseleave = hideTip;
  }

  // ---------- heatmap ----------
  function renderHeat(days) {
    const [ns, ne] = DATA.nightWindow;
    const steps = [0, 1, 2, 3, 4, 5, 6].map((i) => css("--seq-" + i));
    $("#heatRamp").innerHTML = steps.map((c) => `<i style="background:${c}"></i>`).join("");
    const val = (d, h) => GROUPS.reduce((a, g) => a + (HEAT_G === "all" || HEAT_G === g ? d.hourly[G[g].type][h] : 0), 0);
    const max = Math.max(1, ...days.flatMap((d) => [...Array(24)].map((_, h) => val(d, h))));
    let html = `<div></div>` + [...Array(24)].map((_, h) => `<div class="hl">${h % 3 === 0 ? h : ""}</div>`).join("");
    days.forEach((d) => {
      html += `<div class="dl ${d.date === SEL_DAY ? "sel" : ""}" data-day="${d.date}">${mdw(d.date)}</div>`;
      for (let h = 0; h < 24; h++) {
        const v = val(d, h), step = v === 0 ? 0 : Math.min(6, 1 + Math.floor((v / max) * 5.999));
        html += `<div class="c ${h >= ns || h < ne ? "night" : ""}" style="background:${steps[step]}" data-day="${d.date}" data-h="${h}"></div>`;
      }
    });
    const el = $("#heat");
    el.innerHTML = html;
    el.onmousemove = (e) => {
      const c = e.target.closest(".c"); if (!c) return hideTip();
      const d = DATA.days.find((x) => x.date === c.dataset.day), h = +c.dataset.h;
      showTip(`<b>${mdw(d.date)} ${h}:00〜${h + 1}:00</b>` + GROUPS.map((g) => tipRow(css(G[g].tok), G[g].label, d.hourly[G[g].type][h] + " 回")).join(""), e.clientX, e.clientY);
    };

    el.onclick = (e) => { const t = e.target.closest("[data-day]"); if (t) selectDay(t.dataset.day, true); };

    const span = W - left - right;
    const x = (t) => { const [hh, mm, ss] = t.slice(11).split(":").map(Number); return left + ((hh * 3600 + mm * 60 + (ss || 0)) / 86400) * span; };
    const hx = (h) => left + (h / 24) * span;
    const [ns, ne] = DATA.nightWindow;
    const surf = css("--surface-1");
    let s = `<svg class="timeline" viewBox="0 0 ${W} ${H}" role="img" aria-label="${mdw(SEL_DAY)}のイベントタイムライン">`;
    s += `<rect x="${hx(0)}" y="${top}" width="${hx(ne) - hx(0)}" height="${laneH * 3}" rx="8" fill="${css("--night")}"/>`;
    s += `<rect x="${hx(ns)}" y="${top}" width="${hx(24) - hx(ns)}" height="${laneH * 3}" rx="8" fill="${css("--night")}"/>`;
    for (let h = 0; h <= 24; h += 3) {
      s += `<line x1="${hx(h)}" x2="${hx(h)}" y1="${top}" y2="${top + laneH * 3}" stroke="${css("--grid")}"/>`;
      s += `<text x="${hx(h)}" y="${H - 8}" text-anchor="${h === 0 ? "start" : h === 24 ? "end" : "middle"}">${h}:00</text>`;
    }
    GROUPS.forEach((g, i) => {
      const cy = top + laneH * i + laneH / 2, col = css(G[g].tok);
      s += `<line x1="${left}" x2="${W - right}" y1="${cy}" y2="${cy}" stroke="${css("--grid")}" stroke-dasharray="2 5"/>`;
      s += `<text class="lane-label" x="0" y="${cy + 5}">${G[g].label}</text>`;
      if (g === "トイレ") {
        DATA.toiletVisits.filter((v) => v.start.startsWith(SEL_DAY)).forEach((v) => {
          const x1 = x(v.start), w = Math.max(5, (v.min * 60 / 86400) * span);
          const long = v.min >= 30;
          s += `<rect class="ev" x="${x1}" y="${cy - 11}" width="${Math.min(w, W - right - x1)}" height="22" rx="5" fill="${long ? css("--critical") : col}" stroke="${surf}" stroke-width="1.5" data-tip="トイレ ${v.start.slice(11, 16)}〜（${fmt(v.min)}分）${long ? " ⚠ 長時間" : ""}"/>`;
        });

        evs.filter((e) => e.type === G[g].type).forEach((e) => {
          s += `<circle class="ev" cx="${x(e.t)}" cy="${cy}" r="8" fill="${col}" stroke="${surf}" stroke-width="2.5" data-tip="${G[g].label} ${e.t.slice(11, 16)}"/>`;
        });
      }
    });
    s += `</svg>`;
    const tl = $("#timeline");
    tl.innerHTML = s;
    tl.onmousemove = (e) => { const t = e.target.closest(".ev"); t ? showTip(`<b>${t.dataset.tip}</b>`, e.clientX, e.clientY) : hideTip(); };
    tl.onmouseleave = hideTip;

    const d = DATA.days.find((x) => x.date === SEL_DAY), sl = DATA.sleep.find((x) => x.date === SEL_DAY);
    $("#dayStats").innerHTML = [
      ["離床", d.counts["離床"], "回"], ["夜間の離床", d.nightBedExit, "回"], ["トイレ", d.counts["トイレON"], "回"],
      ["平均滞在", fmt(d.toiletAvgMin), "分"], ["ドア開", d.counts["ドアオープン"], "回"],

      options: {
        responsive: true, maintainAspectRatio: false, interaction: { mode: "index", intersect: false },
        scales: {
          x: ax({ grid: { display: false }, ticks: { color: css("--text-muted"), autoSkip: false, maxRotation: 0, callback: (v, i) => /^(00|06|12|18):00$/.test(labels[i]) ? labels[i].replace(/^0/, "") : null } }),
          y: ax({ ticks: { color: css("--text-muted"), maxTicksLimit: 4, padding: 6 }, grace: "5%", ...(zero ? { min: 0 } : {}) }),
        },
        plugins: { tooltip: { displayColors: false, callbacks: { label: (c) => `${fmt(c.parsed.y)} ${unit}` } } },

    dayCharts.push(mini("#dTemp", "temp", css("--series-2"), "℃"), mini("#dLux", "lux", css("--warning"), "lx"), mini("#dMotion", "motion", css("--series-1"), "", true));

    $("#daySel").onchange = (e) => selectDay(e.target.value, false);
    const step = (n) => { const i = DATA.days.findIndex((d) => d.date === SEL_DAY) + n; if (i >= 0 && i < DATA.days.length) selectDay(DATA.days[i].date, false); };
    $("#dayPrev").onclick = () => step(-1);
    $("#dayNext").onclick = () => step(1);
    $("#logTools").onclick = (e) => {
      const b = e.target.closest(".chip"); if (!b) return;
      const g = b.dataset.g;
      LOG_FILTER.has(g) ? LOG_FILTER.delete(g) : LOG_FILTER.add(g);
      b.setAttribute("aria-pressed", LOG_FILTER.has(g));
      renderLog(days);
    };
  }
  function setupReveal(animate) {
    const els = document.querySelectorAll(".reveal");
    if (!animate || !("IntersectionObserver" in window)) { els.forEach((e) => e.classList.add("in")); return; }
    const io = new IntersectionObserver((es) => es.forEach((en) => { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } }), { rootMargin: "0px 0px -8% 0px" });
    els.forEach((e) => io.observe(e));
  }
  let navIO;
  function setupNav() {
    if (navIO) navIO.disconnect();
    const links = [...document.querySelectorAll("#nav a")];
    navIO = new IntersectionObserver((es) => es.forEach((en) => {
      if (en.isIntersecting) links.forEach((a) => a.classList.toggle("on", a.getAttribute("href") === "#" + en.target.id));
    }), { rootMargin: "-40% 0px -55% 0px" });
    document.querySelectorAll("section.block").forEach((s) => navIO.observe(s));
  }
})();
</script>
</body>
</html>
